- name: Determine backend artifact path on controller
  set_fact:
    workspace_root: >-
      {{
        lookup('env', 'GITHUB_WORKSPACE')
        | default(playbook_dir | dirname | dirname | dirname, true)
      }}
    backend_local_jar_path: >-
      {{
        workspace_root ~ '/backend/target/*.jar'
      }}

- name: Create backend app directory
  file:
    path: /opt/backend
    state: directory
    mode: '0755'

- name: Copy backend jar
  copy:
    src: "{{ lookup('ansible.builtin.fileglob', backend_local_jar_path) }}"
    dest: /opt/backend/app.jar
    mode: '0755'

- name: Create backend env file
  template:
    src: backend.env.j2
    dest: /opt/backend/backend.env
    mode: '0600'

- name: Create backend systemd service
  template:
    src: backend.service.j2
    dest: /etc/systemd/system/burger-backend.service
    mode: '0644'

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable backend service
  systemd:
    name: burger-backend
    enabled: yes
    state: restarted

