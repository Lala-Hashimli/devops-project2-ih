- name: Determine frontend artifact path on controller
  set_fact:
    workspace_root: >-
      {{
        lookup('env', 'GITHUB_WORKSPACE')
        | default(playbook_dir | dirname | dirname | dirname, true)
      }}
    frontend_local_dist_path: >-
      {{
        frontend_dist_path
        | default(
            workspace_root ~ '/frontend/dist',
            true
          )
      }}

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Copy frontend build
  copy:
    src: "{{ frontend_local_dist_path }}/"
    dest: /var/www/html/
    mode: '0755'

- name: Configure nginx
  template:
    src: nginx-frontend.conf.j2
    dest: /etc/nginx/sites-available/frontend
    mode: '0644'

- name: Enable frontend site
  file:
    src: /etc/nginx/sites-available/frontend
    dest: /etc/nginx/sites-enabled/frontend
    state: link

- name: Restart nginx
  systemd:
    name: nginx
    enabled: yes
    state: restarted

