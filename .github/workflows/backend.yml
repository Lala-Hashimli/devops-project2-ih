name: Backend

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn -B clean verify

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  deploy:
    needs: build-test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Ensure Ansible dependencies
        run: |
          if ! command -v ansible >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ansible
          fi
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi

      - name: Deploy backend with Ansible
        working-directory: config/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_DB_PASSWORD: ${{ secrets.SQL_DB_PASSWORD }}
          APP_GATEWAY_HOSTNAME: ${{ secrets.APP_GATEWAY_HOSTNAME }}
        run: |
          ansible-playbook playbooks/backend.yml \
            -e "ansible_password=$VM_ADMIN_PASSWORD" \
            -e "db_password=$SQL_DB_PASSWORD" \
            -e "app_gateway_url=$APP_GATEWAY_HOSTNAME"

      - name: Validate backend through Application Gateway
        run: curl "${{ secrets.APP_GATEWAY_URL }}/api/health"
