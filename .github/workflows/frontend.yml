name: Frontend

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}
        run: npm run build

      - name: Archive frontend build
        run: tar -czf frontend-dist.tar.gz -C frontend dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz

  deploy:
    needs: build-test
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .

      - name: Extract frontend artifact
        run: |
          rm -rf frontend/dist
          tar -xzf frontend-dist.tar.gz -C frontend

      - name: Ensure Ansible dependencies
        run: |
          if ! command -v ansible >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ansible
          fi
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi

      - name: Deploy frontend with Ansible
        working-directory: config/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_DB_PASSWORD: ${{ secrets.SQL_DB_PASSWORD }}
          APP_GATEWAY_HOSTNAME: ${{ secrets.APP_GATEWAY_HOSTNAME }}
        run: |
          ansible-playbook playbooks/frontend.yml \
            -e "ansible_password=$VM_ADMIN_PASSWORD" \
            -e "db_password=$SQL_DB_PASSWORD" \
            -e "app_gateway_url=$APP_GATEWAY_HOSTNAME"

      - name: Validate through Application Gateway
        run: curl -I "${{ secrets.APP_GATEWAY_URL }}"
